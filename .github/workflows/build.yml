name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 5'
  push:
    paths-ignore:
      - "README.md"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android ARM64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android ARM32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86-64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android x86-64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          
      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: dist/my-app-binary
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: build/windows/x64/runner/Release/
          compression-level: 9

  build-linux-x64:
    name: Build Linux x86-64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libgtk-3-dev
          flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Linux x86-64
          path: build/linux/x64/release/bundle/
          compression-level: 9

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: dist/my-app-binary
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: main
          cache: true

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libgtk-3-dev
          flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Linux ARM64
          path: build/linux/arm64/release/bundle/
          compression-level: 9

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: dist/my-app-binary
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build macos --release

      - name: Create Apple Disk Image (.dmg)
        run: |
          hdiutil create -format UDZO -srcfolder build/macos/Build/Products/Release/c001apk-flutter.app c001apk.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: c001apk.dmg

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: dist/my-app-binary
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
