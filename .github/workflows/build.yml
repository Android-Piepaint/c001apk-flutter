name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 5'
  push:
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

  

  build-linux-x64:
    name: Build Linux x86-64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libgtk-3-dev
          flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Archive Linux x64 Build
        run: tar -czvf c001apk-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux x64
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-build
          path: c001apk-linux-x64.tar.gz

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: main
          cache: true

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libgtk-3-dev
          flutter pub get

      - name: Build
        run: flutter build linux --release

      - name: Archive Linux ARM64 Build
        run: tar -czvf c001apk-linux-arm64.tar.gz -C build/linux/arm64/release/bundle .

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-build
          path: c001apk-linux-arm64.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build macos --release

      - name: Create Apple Disk Image (.dmg)
        run: |
          hdiutil create -format UDZO -srcfolder build/macos/Build/Products/Release/c001apk-flutter.app c001apk-macos.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: c001apk-macos.dmg

  publish-release:
    name: Create Release & Upload All Artifacts
    needs: [build-android, build-linux-x64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: all-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
